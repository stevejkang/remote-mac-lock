name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build -o remote-mac-lock-darwin-${{ matrix.goarch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: remote-mac-lock-darwin-${{ matrix.goarch }}
          path: remote-mac-lock-darwin-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            remote-mac-lock-darwin-amd64/remote-mac-lock-darwin-amd64
            remote-mac-lock-darwin-arm64/remote-mac-lock-darwin-arm64
